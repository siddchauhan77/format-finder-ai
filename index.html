<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Format Finder AI — Find Your Peak</title>
  <meta name="description" content="Discover your ideal content format with AI. Answer a few questions and get a personalized content format recommendation." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --border: #2a2a2a;
      --accent: #c8a96e;
      --accent-dim: rgba(200, 169, 110, 0.12);
      --text: #f0ece4;
      --muted: #888;
      --radius: 16px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px 40px;
    }

    /* Header */
    .header {
      text-align: center;
      max-width: 560px;
      margin-bottom: 40px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent-dim);
      border: 1px solid rgba(200, 169, 110, 0.3);
      border-radius: 100px;
      padding: 6px 14px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 20px;
    }

    .eyebrow::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(28px, 5vw, 44px);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 14px;
    }

    h1 span {
      color: var(--accent);
    }

    .subtitle {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.6;
      max-width: 440px;
      margin: 0 auto;
    }

    /* Chat container */
    .chat-wrapper {
      width: 100%;
      max-width: 800px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .chat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      flex: 1;
      min-height: 580px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 60px rgba(200, 169, 110, 0.06), 0 24px 64px rgba(0,0,0,0.5);
    }

    .chat-topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
    }

    .bot-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent) 0%, #a07840 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .bot-info strong {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .bot-info span {
      font-size: 11px;
      color: #4caf50;
      font-weight: 500;
    }

    .bot-info span::before {
      content: '● ';
      font-size: 8px;
    }

    iframe {
      flex: 1;
      width: 100%;
      border: none;
      display: block;
      min-height: 520px;
      background: transparent;
    }

    /* Footer */
    .footer {
      margin-top: 28px;
      text-align: center;
      font-size: 12px;
      color: #555;
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .footer a:hover { text-decoration: underline; }

    /* Divider dots */
    .footer-dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 10px;
      font-size: 12px;
      color: #444;
    }

    .footer-dots::before,
    .footer-dots::after {
      content: '';
      flex: 1;
      max-width: 60px;
      height: 1px;
      background: var(--border);
    }

    /* Responsive */
    @media (max-width: 600px) {
      .page { padding: 32px 16px 28px; }
      .chat-card { min-height: 480px; }
      iframe { min-height: 420px; }
    }
  </style>
</head>
<body>
  <div class="page">

    <header class="header">
      <div class="eyebrow">AI-Powered · Find Your Peak</div>
      <h1>Find Your <span>Content Format</span></h1>
      <p class="subtitle">
        Answer a few questions and get a personalized recommendation for the content format that fits you best.
      </p>
    </header>

    <div class="chat-wrapper">
      <div class="chat-card">
        <div class="chat-topbar">
          <div class="bot-avatar">✦</div>
          <div class="bot-info">
            <strong>Format Finder AI</strong>
            <span>Online</span>
          </div>
        </div>
        <iframe
          src="https://www.chatbase.co/chatbot-iframe/xloySADSdWv53WwIz54aW"
          title="Format Finder AI"
          allow="microphone"
          loading="lazy"
        ></iframe>
      </div>
    </div>

    <footer class="footer">
      <div class="footer-dots">Format Finder AI</div>
      Built with <a href="https://findyourpeak.onepeakcreative.com" target="_blank" rel="noopener">One Peak Creative</a>
    </footer>

  </div>
</body>
</html>
